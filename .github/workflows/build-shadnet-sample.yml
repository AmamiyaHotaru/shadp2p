
name: Build shadnet-sample (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "clientsample/**"
      - ".github/workflows/build-shadnet-sample.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: cmake -S clientsample -B build/clientsample -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build/clientsample --config Release --parallel

      - name: Collect executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/clientsample" -Filter "shadnet-sample.exe" -Recurse -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "shadnet-sample.exe was not generated."
            exit 1
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $exe.FullName "dist/shadnet-sample.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shadnet-sample-windows-x64
          path: dist/shadnet-sample.exe
          if-no-files-found: error
          retention-days: 30
